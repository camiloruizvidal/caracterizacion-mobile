<div *ngIf="mostrarPonderado" class="ponderado-container">
  <div class="alerta-header">
    <div class="color-indicator" [style.background-color]="color"></div>
    <ion-badge color="light" class="ion-padding">
      {{ nivelRiesgo }}: {{ ponderado }}
    </ion-badge>
  </div>

  <!-- Planes de cuidado -->
  <div class="planes-cuidado-container">
    <h3>Planes de Cuidado</h3>

    <div class="planes-list">
      <form [formGroup]="formularioPlanes">
        <div formArrayName="planes">
          <div
            *ngFor="let plan of planes.controls; let i = index"
            class="plan-item"
          >
            <ion-item lines="none" class="plan-content">
              <ion-textarea
                [formControlName]="i"
                autoGrow="true"
                placeholder="Escriba el plan de cuidado"
                class="plan-textarea"
              >
              </ion-textarea>
              <ion-button
                slot="end"
                (click)="borrarPlan(i)"
                color="danger"
                fill="clear"
              >
                <ion-icon name="trash-bin-outline"></ion-icon>
              </ion-button>
            </ion-item>
          </div>
        </div>
      </form>
    </div>

    <ion-button
      expand="block"
      color="warning"
      (click)="agregarPlan()"
      class="ion-margin-top"
    >
      <ion-icon name="bag-add-outline" slot="start"></ion-icon>
      Agregar Plan de Cuidado
    </ion-button>
  </div>
</div>
