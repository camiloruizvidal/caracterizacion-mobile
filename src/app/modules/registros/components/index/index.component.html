<ion-content class="ion-padding">
  <ion-button routerLink="/registros/nuevo" [disabled]="!tieneFichas">
    <ion-icon name="add-circle-sharp"></ion-icon>
    &nbsp; Nuevo Registro
  </ion-button>
  <div class="ion-text-center ion-margin-top" *ngIf="!tieneFichas">
    <ion-card class="warning-card">
      <ion-card-content class="ion-padding">
        <div class="warning-content">
          <ion-icon name="warning-outline" class="warning-icon"></ion-icon>
          <p class="warning-text">
            Aún no ha cargado la ficha. Por favor actualice los formularios para continuar.
          </p>
          <ion-button 
            routerLink="/load" 
            color="warning" 
            fill="solid" 
            class="update-button">
            <ion-icon name="refresh-circle" slot="start"></ion-icon>
            Ir a Actualizar
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Lista de tarjetas</ion-card-title>
      <ion-card-subtitle>
        Seleccione e ingrese a un listado si desea editarlo o revisarlo.
      </ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <app-listar></app-listar>
    </ion-card-content>
  </ion-card>
</ion-content>
