<div id="login">
  <ion-card id="card-login">
    <ion-card-header>
      <!-- 🏥 Icono médico premium -->
      <div class="medical-icon-container">
        <ion-icon name="medical" class="medical-icon"></ion-icon>
        <div class="medical-pulse-ring"></div>
      </div>
      
      <ion-card-title>
        🏥 Sistema de Caracterización
      </ion-card-title>
      <ion-card-subtitle>
        Acceso seguro al sistema médico
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <ion-item>
          <ion-label aria-label="username" position="floating">
            Nombre de Usuario
          </ion-label>
          <ion-input formControlName="username" type="text"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label aria-label="password" position="floating">
            Contraseña
          </ion-label>
          <ion-input formControlName="password" type="password"></ion-input>
        </ion-item>

        <ion-button expand="full" type="submit" [disabled]="!loginForm.valid"
          >Iniciar Sesión</ion-button
        >
        
        <!-- 🔧 Enlace para configurar servidor -->
        <div class="ion-text-center ion-margin-top">
          <ion-button 
            fill="clear" 
            size="small" 
            (click)="openServerConfig()"
            class="config-server-btn">
            <ion-icon name="settings" slot="start"></ion-icon>
            Configurar Servidor
          </ion-button>
        </div>
        <div class="ion-text-center ion-margin-top">
          <ion-badge
            *ngIf="!siInicioSesion"
            color="warning"
            class="ion-padding"
            style="white-space: normal; width: 100%; display: block"
          >
            <ion-icon name="warning-outline"></ion-icon>
            Recuerde que debe iniciar sesión la primera vez con acceso a
            internet
          </ion-badge>
        </div>
        <div class="ion-text-center ion-margin-top">
          <ion-badge
            *ngIf="esTest"
            color="danger"
            class="ion-padding"
            style="white-space: normal; width: 100%; display: block"
          >
            <ion-icon name="warning-outline"></ion-icon>
            MODO PRUEBAS
          </ion-badge>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</div>
