<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Sistema Médico</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list class="menu-list">
      <!-- 📝 Registros médicos -->
      <ion-item (click)="redirectTo('/registros')">
        <ion-icon slot="start" name="medical"></ion-icon>
        <ion-label>Registros Médicos</ion-label>
      </ion-item>
      
      <!-- 📤 Enviar datos -->
      <ion-item (click)="redirectTo('/registros/enviar')">
        <ion-icon slot="start" name="cloud-upload"></ion-icon>
        <ion-label>Subir Datos a la nube</ion-label>
      </ion-item>
      
      <!-- 🔄 Actualizar sistema -->
      <ion-item (click)="redirectTo('/load')">
        <ion-icon slot="start" name="refresh-circle"></ion-icon>
        <ion-label>Actualizar Sistema</ion-label>
      </ion-item>
      
      <!-- 👤 Perfil (oculto) -->
      <ion-item (click)="redirectTo('/profile')" *ngIf="false">
        <ion-icon slot="start" name="person-circle"></ion-icon>
        <ion-label>Mi Perfil</ion-label>
      </ion-item>
      
      <!-- 🚪 Cerrar sesión -->
      <ion-item (click)="redirectTo('/login')" button class="cerrar-sesion">
        <ion-icon slot="start" name="log-out"></ion-icon>
        <ion-label>Cerrar Sesión</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>
<div class="ion-page" id="main-content">
  <ion-header  *ngIf="isShowMenu">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Menú</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</div>
